<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo Trans</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #5BCFFA 0%, #F5ABB9 50%, #FFFFFF 100%);
    }

    .card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      padding: 3rem 4rem;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      background: white;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(91, 207, 250, 0.3);
    }

    p {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>¡Hola, Mundo!</h1>
    <p>Inspirado en la bandera trans 🏳️‍⚧️</p>
  </div>
</body>

</html>
